services:
  localstack:
    image: localstack/localstack-pro:2026.10.0
    ports:
      - "4566:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - SERVICES=kinesis,dynamodb,iam,sts
      - ENFORCE_IAM=1
    healthcheck:
      test: ["CMD", "/opt/code/localstack/.venv/bin/python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health', timeout=3)"]
      interval: 5s
      retries: 20

  brazemock:
    build:
      context: .
      dockerfile: cmd/brazemock/Dockerfile
    ports: 
    - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

